name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish a release: tag to create on this commit (e.g. v2.4.0). Must match the pubspec version. Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write  # needed to create GitHub Releases (and their tags)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A manual release must name a new vX.Y.Z tag that matches pubspec.yaml,
      # so the published APK's version and its tag can't drift apart.
      - name: Check release tag (manual releases only)
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release_tag must look like v1.2.3"; exit 1; }
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          [ "v$version" = "$TAG" ] || { echo "::error::release_tag $TAG does not match pubspec version $version"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      # With ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PROPERTIES secrets the APK
      # is release-signed; without them Gradle falls back to debug signing and
      # the release-publish step is skipped so an unsigned build never
      # replaces a properly signed release asset.
      - name: Set up release signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk seerati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: seerati-apk
          path: seerati.apk

      # Tag pushes, or a manual run with release_tag (creates the tag on this
      # commit). Signed builds only.
      - name: Publish GitHub Release (signed builds only)
        if: steps.signing.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: seerati.apk
          generate_release_notes: true

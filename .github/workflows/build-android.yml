name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the APK to GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      # With ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PROPERTIES secrets the APK
      # is release-signed; without them Gradle falls back to debug signing and
      # the release-publish step is skipped so an unsigned build never
      # replaces a properly signed release asset.
      - name: Set up release signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk seerati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: seerati-apk
          path: seerati.apk

      - name: Publish GitHub Release (signed tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: seerati.apk
          generate_release_notes: true

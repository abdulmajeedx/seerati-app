name: Release notes

# Re-applies .github/release-notes/<tag>.md (title + description) to a
# release that already exists. Doesn't rebuild or touch its assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v2.4.0'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        id: notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -f ".github/release-notes/$TAG.md" ] || { echo "::error::no .github/release-notes/$TAG.md"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG does not exist"; exit 1; }
          .github/release-notes/prepare.sh "$TAG"

      # gh edits only the title and notes. action-gh-release's update path
      # also sends target_commitish and was refused (403) on an existing release.
      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ steps.notes.outputs.name }}
          BODY: ${{ steps.notes.outputs.body_path }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$BODY"
